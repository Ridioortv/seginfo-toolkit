services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    restart: unless-stopped
    image: opensearchproject/opensearch:2.16.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  auth-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/auth-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"

  asset-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/asset-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8002:8000"


  scan-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/scan-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    volumes:
      # Cache de la DB de CVEs de trivy y de las plantillas de nuclei --
      # persistentes entre reinicios/rebuilds para que solo se paguen
      # una vez (ver Dockerfile y app/scanners/{trivy,nuclei}.py).
      - trivy_cache:/root/.cache/trivy
      - nuclei_templates:/root/nuclei-templates
    # Capabilities elevadas, SOLO para zeek/falco (ver app/scanners/zeek.py
    # y app/scanners/falco.py) -- ningun otro scanner de esta plataforma
    # las necesita. NET_RAW/NET_ADMIN: captura de paquetes en modo
    # promiscuo (zeek). SYS_PTRACE/SYS_ADMIN/SYS_RESOURCE + BPF/PERFMON:
    # cargar y correr el driver eBPF "moderno" de falco (requiere un
    # kernel con soporte BTF -- en Docker Desktop depende de la version/
    # el backend WSL2 vs Hyper-V; si el kernel del host no alcanza, falco
    # termina con un error claro al arrancar en vez de degradarse en
    # silencio, ver FalcoDriver.run). Decision de producto que acepta
    # este riesgo/complejidad de despliegue extra (Manu, 2026) a cambio
    # de sumar estos dos scanners -- si BPF/PERFMON no son reconocidos
    # por tu version de Docker Engine (nombres de capability mas nuevos,
    # Docker 20.10+), sacalos de esta lista; zeek sigue funcionando con
    # solo NET_RAW/NET_ADMIN.
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - SYS_PTRACE
      - SYS_ADMIN
      - SYS_RESOURCE
      - BPF
      - PERFMON
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8003:8000"

  # Agente de escaneo remoto que corre DENTRO del stack. Reusa la imagen de
  # scan-service (ya trae trivy/nuclei) y hace polling a scan-service
  # ejecutando los jobs asignados al "Agente Docker". Se auto-registra via
  # BOOTSTRAP_AGENTS (ver .env). Por el NAT de Docker Desktop solo llega a
  # internet y a la propia PC (host.docker.internal), NO a la LAN -- para
  # la LAN esta el agente de host (ver remote-agent/README.md). build con
  # el MISMO Dockerfile que scan-service: buildkit reusa toda la cache,
  # asi que no reconstruye nada pesado.
  remote-agent:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/scan-service/Dockerfile
    command: ["python", "/agent.py"]
    environment:
      SCAN_SERVICE_URL: http://scan-service:8000
      AGENT_API_KEY: ${REMOTE_AGENT_DOCKER_KEY}
      POLL_INTERVAL_SECONDS: "10"
      # trivy/nuclei no tienen forma de atravesar el NAT de Docker Desktop
      # -- con esto en "1", un job de cualquiera de los 2 contra una IP de
      # LAN (192.168.x.x, 10.x.x.x, etc.) falla al toque con un mensaje
      # claro en vez de quedarse varios minutos intentando conectar.
      # Ver remote-agent/agent.py::_process_job.
      AGENT_BEHIND_DOCKER_NAT: "1"
      # Este agente corre con la MISMA imagen que scan-service (ver el
      # build de arriba), que ya trae horneadas las reglas propias de
      # semgrep/yara (ver Dockerfile, COPY rules/{semgrep,yara}) -- se
      # los apunta ahi en vez del default relativo "./rules/..." de
      # agent.py (pensado para cuando este script corre SUELTO en una
      # maquina sin ese build, ver remote-agent/README.md).
      SENTINELOPS_SEMGREP_RULES_DIR: /opt/sentinelops-semgrep-rules
      SENTINELOPS_YARA_RULES_FILE: /opt/sentinelops-yara-rules/sentinelops.yar
      SENTINELOPS_ZAP_HOME_DIR: /home/sentinelops/.ZAP
    # Capabilities elevadas, SOLO para zeek/falco (ver app/scanners/zeek.py
    # y app/scanners/falco.py) -- ningun otro scanner de esta plataforma
    # las necesita. NET_RAW/NET_ADMIN: captura de paquetes en modo
    # promiscuo (zeek). SYS_PTRACE/SYS_ADMIN/SYS_RESOURCE + BPF/PERFMON:
    # cargar y correr el driver eBPF "moderno" de falco (requiere un
    # kernel con soporte BTF -- en Docker Desktop depende de la version/
    # el backend WSL2 vs Hyper-V; si el kernel del host no alcanza, falco
    # termina con un error claro al arrancar en vez de degradarse en
    # silencio, ver FalcoDriver.run). Decision de producto que acepta
    # este riesgo/complejidad de despliegue extra (Manu, 2026) a cambio
    # de sumar estos dos scanners -- si BPF/PERFMON no son reconocidos
    # por tu version de Docker Engine (nombres de capability mas nuevos,
    # Docker 20.10+), sacalos de esta lista; zeek sigue funcionando con
    # solo NET_RAW/NET_ADMIN.
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - SYS_PTRACE
      - SYS_ADMIN
      - SYS_RESOURCE
      - BPF
      - PERFMON
    # No es un servidor web (corre agent.py, no uvicorn), asi que el
    # healthcheck de la imagen no aplica -> lo desactivamos para que no
    # figure "unhealthy".
    healthcheck:
      disable: true
    volumes:
      - ./remote-agent/agent.py:/agent.py:ro
    depends_on:
      scan-service:
        condition: service_healthy

  vuln-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/vuln-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8004:8000"

  siem-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/siem-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      OPENSEARCH_HOST: opensearch
      SOAR_SERVICE_URL: http://soar-service:8000
      THREATINTEL_SERVICE_URL: http://threatintel-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # service_started (no service_healthy): siem-service ya tolera que
      # OpenSearch tarde en estar listo (ver el try/except en su lifespan),
      # asi que no tiene sentido que el resto de la plataforma (via
      # frontend, que depende de siem-service) se quede bloqueada
      # esperando a que OpenSearch pase su healthcheck -- que es lento y
      # pesado en memoria, sobre todo mientras arrancan otros 14
      # contenedores a la vez.
      opensearch:
        condition: service_started
    ports:
      - "8005:8000"

  soar-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/soar-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      SOAR_DRY_RUN: "true"
      CASE_SERVICE_URL: http://case-service:8000
      INTEGRATION_SERVICE_URL: http://integration-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      notification-service:
        condition: service_started
    ports:
      - "8006:8000"

  case-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/case-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      SOAR_SERVICE_URL: http://soar-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8007:8000"

  purple-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/purple-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      SIEM_SERVICE_URL: http://siem-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8008:8000"

  report-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/report-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      VULN_SERVICE_URL: http://vuln-service:8000
      SIEM_SERVICE_URL: http://siem-service:8000
      CASE_SERVICE_URL: http://case-service:8000
      PURPLE_SERVICE_URL: http://purple-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      notification-service:
        condition: service_started
    ports:
      - "8009:8000"

  notification-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/notification-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      NOTIFICATION_DRY_RUN: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8010:8000"

  integration-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/integration-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      INTEGRATION_DRY_RUN: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8011:8000"

  threatintel-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/threatintel-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8012:8000"

  asm-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/asm-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8013:8000"

  cloud-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/cloud-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8014:8000"

  coderepo-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/coderepo-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    volumes:
      # Cache de la DB de CVEs de trivy -- PROPIO de este servicio, nunca
      # el `trivy_cache` de scan-service (dos contenedores escribiendo la
      # misma cache de trivy en simultaneo puede corromper el archivo
      # bolt de la DB). Ver Dockerfile y app/services.py.
      - coderepo_trivy_cache:/root/.cache/trivy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8015:8000"

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
    env_file: .env
    depends_on:
      - auth-service
      - asset-service
      - scan-service
      - vuln-service
      - siem-service
      - soar-service
      - case-service
      - purple-service
      - report-service
      - notification-service
      - integration-service
      - threatintel-service
      - asm-service
      - cloud-service
      - coderepo-service
    ports:
      - "5173:5173"

networks:
  default: {}

volumes:
  pgdata:
  # scan-service: cache persistente de trivy/nuclei (ver Dockerfile y
  # app/scanners/{trivy,nuclei}.py)
  trivy_cache:
  nuclei_templates:
  # coderepo-service: cache persistente de trivy, PROPIA (nunca se
  # comparte con scan-service, ver docstring del servicio arriba)
  coderepo_trivy_cache: