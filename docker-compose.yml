services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    restart: unless-stopped
    image: opensearchproject/opensearch:2.16.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  auth-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/auth-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"

  asset-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/asset-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8002:8000"

  scan-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/scan-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8003:8000"

  vuln-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/vuln-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8004:8000"

  siem-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/siem-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      OPENSEARCH_HOST: opensearch
      SOAR_SERVICE_URL: http://soar-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # service_started (no service_healthy): siem-service ya tolera que
      # OpenSearch tarde en estar listo (ver el try/except en su lifespan),
      # asi que no tiene sentido que el resto de la plataforma (via
      # frontend, que depende de siem-service) se quede bloqueada
      # esperando a que OpenSearch pase su healthcheck -- que es lento y
      # pesado en memoria, sobre todo mientras arrancan otros 14
      # contenedores a la vez.
      opensearch:
        condition: service_started
    ports:
      - "8005:8000"

  soar-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/soar-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      SOAR_DRY_RUN: "true"
      CASE_SERVICE_URL: http://case-service:8000
      INTEGRATION_SERVICE_URL: http://integration-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8006:8000"

  case-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/case-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      SOAR_SERVICE_URL: http://soar-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8007:8000"

  purple-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/purple-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      SIEM_SERVICE_URL: http://siem-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8008:8000"

  report-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/report-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      VULN_SERVICE_URL: http://vuln-service:8000
      SIEM_SERVICE_URL: http://siem-service:8000
      CASE_SERVICE_URL: http://case-service:8000
      PURPLE_SERVICE_URL: http://purple-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8009:8000"

  notification-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/notification-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      NOTIFICATION_DRY_RUN: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8010:8000"

  integration-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/integration-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      INTEGRATION_DRY_RUN: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8011:8000"

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
    env_file: .env
    depends_on:
      - auth-service
      - asset-service
      - scan-service
      - vuln-service
      - siem-service
      - soar-service
      - case-service
      - purple-service
      - report-service
      - notification-service
      - integration-service
    ports:
      - "5173:5173"

volumes:
  pgdata:
