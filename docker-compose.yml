services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    restart: unless-stopped
    image: opensearchproject/opensearch:2.16.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  auth-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/auth-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"

  asset-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/asset-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8002:8000"


  # --- OpenVAS/GVM (Greenbone Community Edition), subset headless -------
  # Adaptado del compose.yaml oficial de Greenbone
  # (https://greenbone.github.io/docs/latest/_static/compose.yaml),
  # excluyendo gsa/gsad/gvm-config/nginx (la GUI web -- no la necesitamos,
  # scan-service habla GMP directo contra el socket de gvmd via gvm-cli)
  # y gvm-tools (ya instalamos ese mismo paquete pip, gvm-tools, DENTRO
  # de scan-service -- no necesitamos un contenedor CLI aparte).
  #
  # Primer arranque: la sincronizacion inicial del feed de NVTs (via
  # vulnerability-tests/notus-data/scap-data/etc, cada uno con
  # KEEP_ALIVE: 1 para quedarse corriendo hasta que gvmd los de por
  # completos via su healthcheck) puede tardar bastante (horas, varios
  # GB) la primera vez. Ver README/STATUS.md para el paso manual de
  # bootstrap del usuario admin (docker compose exec -u gvmd gvmd gvmd
  # --user=admin --new-password=...).
  vulnerability-tests:
    image: registry.community.greenbone.net/community/vulnerability-tests
    environment:
      FEED_RELEASE: "24.10"
      KEEP_ALIVE: 1
    volumes:
      - vt_data_vol:/mnt

  notus-data:
    image: registry.community.greenbone.net/community/notus-data
    environment:
      KEEP_ALIVE: 1
    volumes:
      - notus_data_vol:/mnt

  scap-data:
    image: registry.community.greenbone.net/community/scap-data
    environment:
      KEEP_ALIVE: 1
    volumes:
      - scap_data_vol:/mnt

  cert-bund-data:
    image: registry.community.greenbone.net/community/cert-bund-data
    environment:
      KEEP_ALIVE: 1
    volumes:
      - cert_data_vol:/mnt

  dfn-cert-data:
    image: registry.community.greenbone.net/community/dfn-cert-data
    environment:
      KEEP_ALIVE: 1
    volumes:
      - cert_data_vol:/mnt
    depends_on:
      cert-bund-data:
        condition: service_healthy

  data-objects:
    image: registry.community.greenbone.net/community/data-objects
    environment:
      FEED_RELEASE: "24.10"
      KEEP_ALIVE: 1
    volumes:
      - data_objects_vol:/mnt

  report-formats:
    image: registry.community.greenbone.net/community/report-formats
    environment:
      FEED_RELEASE: "24.10"
      KEEP_ALIVE: 1
    volumes:
      - data_objects_vol:/mnt
    depends_on:
      data-objects:
        condition: service_healthy

  gpg-data:
    image: registry.community.greenbone.net/community/gpg-data
    volumes:
      - gpg_data_vol:/mnt

  gvm-redis:
    # Redis PROPIO de GVM/ospd-openvas -- servicio y nombre distintos del
    # `redis` que ya usa el resto de SentinelOps (sin colision: cada uno
    # con su propio volumen de socket unix, ninguno expone puerto TCP).
    image: registry.community.greenbone.net/community/redis-server
    restart: unless-stopped
    volumes:
      - gvm_redis_socket_vol:/run/redis/

  pg-gvm:
    image: registry.community.greenbone.net/community/pg-gvm:stable
    restart: unless-stopped
    volumes:
      - gvm_psql_data_vol:/var/lib/postgresql
      - gvm_psql_socket_vol:/var/run/postgresql
    depends_on:
      pg-gvm-migrator:
        condition: service_completed_successfully

  pg-gvm-migrator:
    image: registry.community.greenbone.net/community/pg-gvm-migrator:stable
    volumes:
      - gvm_psql_data_vol:/var/lib/postgresql
      - gvm_psql_socket_vol:/var/run/postgresql

  gvmd:
    image: registry.community.greenbone.net/community/gvmd:stable
    restart: unless-stopped
    volumes:
      - gvmd_data_vol:/var/lib/gvm
      - scap_data_vol:/var/lib/gvm/scap-data/
      - cert_data_vol:/var/lib/gvm/cert-data
      - data_objects_vol:/var/lib/gvm/data-objects/gvmd
      - vt_data_vol:/var/lib/openvas/plugins
      - gvm_psql_data_vol:/var/lib/postgresql
      - gvmd_socket_vol:/run/gvmd
      - ospd_openvas_socket_vol:/run/ospd
      - gvm_psql_socket_vol:/var/run/postgresql
    depends_on:
      pg-gvm:
        condition: service_started
      scap-data:
        condition: service_healthy
      cert-bund-data:
        condition: service_healthy
      dfn-cert-data:
        condition: service_healthy
      data-objects:
        condition: service_healthy
      report-formats:
        condition: service_healthy

  configure-openvas:
    image: registry.community.greenbone.net/community/openvas-scanner:stable
    volumes:
      - openvas_data_vol:/mnt
      - openvas_log_data_vol:/var/log/openvas
    command:
      - /bin/sh
      - -c
      - |
        printf "table_driven_lsc = yes\nopenvasd_server = http://openvasd:80\n" > /mnt/openvas.conf
        sed "s/127/128/" /etc/openvas/openvas_log.conf | sed 's/gvm/openvas/' > /mnt/openvas_log.conf
        chmod 644 /mnt/openvas.conf
        chmod 644 /mnt/openvas_log.conf
        touch /var/log/openvas/openvas.log
        chmod 666 /var/log/openvas/openvas.log

  openvas:
    image: registry.community.greenbone.net/community/openvas-scanner:stable
    volumes:
      - openvas_data_vol:/etc/openvas
      - openvas_log_data_vol:/var/log/openvas
    command:
      - /bin/sh
      - -c
      - |
        cat /etc/openvas/openvas.conf
        tail -f /var/log/openvas/openvas.log
    depends_on:
      configure-openvas:
        condition: service_completed_successfully

  openvasd:
    image: registry.community.greenbone.net/community/openvas-scanner:stable
    restart: unless-stopped
    environment:
      OPENVASD_MODE: service_notus
      GNUPGHOME: /etc/openvas/gnupg
      LISTENING: 0.0.0.0:80
    volumes:
      - openvas_data_vol:/etc/openvas
      - openvas_log_data_vol:/var/log/openvas
      - gpg_data_vol:/etc/openvas/gnupg
      - notus_data_vol:/var/lib/notus
    depends_on:
      vulnerability-tests:
        condition: service_healthy
      notus-data:
        condition: service_healthy
      configure-openvas:
        condition: service_completed_successfully
      gpg-data:
        condition: service_completed_successfully

  ospd-openvas:
    # Requiere NET_ADMIN/NET_RAW + seccomp/apparmor sin confinar: son
    # capacidades reales de red de bajo nivel que necesita el motor de
    # escaneo openvas para armar paquetes el mismo (no es un capricho de
    # la imagen). Esto es una elevacion de privilegios genuina sobre este
    # contenedor puntual -- ver README/STATUS.md.
    image: registry.community.greenbone.net/community/ospd-openvas:stable
    restart: unless-stopped
    hostname: ospd-openvas.local
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    command:
      [
        "ospd-openvas",
        "-f",
        "--config",
        "/etc/gvm/ospd-openvas.conf",
        "--notus-feed-dir",
        "/var/lib/notus/advisories",
        "-m",
        "666",
      ]
    volumes:
      - gpg_data_vol:/etc/openvas/gnupg
      - vt_data_vol:/var/lib/openvas/plugins
      - notus_data_vol:/var/lib/notus
      - ospd_openvas_socket_vol:/run/ospd
      - gvm_redis_socket_vol:/run/redis/
      - openvas_data_vol:/etc/openvas/
      - openvas_log_data_vol:/var/log/openvas
    depends_on:
      gvm-redis:
        condition: service_started
      gpg-data:
        condition: service_completed_successfully
      configure-openvas:
        condition: service_completed_successfully
      vulnerability-tests:
        condition: service_healthy
      notus-data:
        condition: service_healthy

  scan-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/scan-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      GVM_SOCKET_PATH: /run/gvmd/gvmd.sock
    volumes:
      # Cache de la DB de CVEs de trivy y de las plantillas de nuclei --
      # persistentes entre reinicios/rebuilds para que solo se paguen
      # una vez (ver Dockerfile y app/scanners/{trivy,nuclei}.py).
      - trivy_cache:/root/.cache/trivy
      - nuclei_templates:/root/nuclei-templates
      # Socket unix de gvmd para hablar GMP via gvm-cli (ver
      # app/scanners/openvas.py). Montado read-only: scan-service es un
      # cliente, no administra gvmd.
      - gvmd_socket_vol:/run/gvmd:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gvmd:
        condition: service_started
    ports:
      - "8003:8000"

  vuln-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/vuln-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8004:8000"

  siem-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/siem-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      OPENSEARCH_HOST: opensearch
      SOAR_SERVICE_URL: http://soar-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # service_started (no service_healthy): siem-service ya tolera que
      # OpenSearch tarde en estar listo (ver el try/except en su lifespan),
      # asi que no tiene sentido que el resto de la plataforma (via
      # frontend, que depende de siem-service) se quede bloqueada
      # esperando a que OpenSearch pase su healthcheck -- que es lento y
      # pesado en memoria, sobre todo mientras arrancan otros 14
      # contenedores a la vez.
      opensearch:
        condition: service_started
    ports:
      - "8005:8000"

  soar-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/soar-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      SOAR_DRY_RUN: "true"
      CASE_SERVICE_URL: http://case-service:8000
      INTEGRATION_SERVICE_URL: http://integration-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      notification-service:
        condition: service_started
    ports:
      - "8006:8000"

  case-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/case-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      SOAR_SERVICE_URL: http://soar-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8007:8000"

  purple-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/purple-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      SIEM_SERVICE_URL: http://siem-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8008:8000"

  report-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/report-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      VULN_SERVICE_URL: http://vuln-service:8000
      SIEM_SERVICE_URL: http://siem-service:8000
      CASE_SERVICE_URL: http://case-service:8000
      PURPLE_SERVICE_URL: http://purple-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      notification-service:
        condition: service_started
    ports:
      - "8009:8000"

  notification-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/notification-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      NOTIFICATION_DRY_RUN: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8010:8000"

  integration-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/integration-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      INTEGRATION_DRY_RUN: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8011:8000"

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
    env_file: .env
    depends_on:
      - auth-service
      - asset-service
      - scan-service
      - vuln-service
      - siem-service
      - soar-service
      - case-service
      - purple-service
      - report-service
      - notification-service
      - integration-service
    ports:
      - "5173:5173"

volumes:
  pgdata:
  # scan-service: cache persistente de trivy/nuclei (ver Dockerfile y
  # app/scanners/{trivy,nuclei}.py)
  trivy_cache:
  nuclei_templates:
  # OpenVAS/GVM (Greenbone Community Edition, subset headless)
  gpg_data_vol:
  scap_data_vol:
  cert_data_vol:
  data_objects_vol:
  gvmd_data_vol:
  gvm_psql_data_vol:
  vt_data_vol:
  notus_data_vol:
  gvm_psql_socket_vol:
  gvmd_socket_vol:
  ospd_openvas_socket_vol:
  gvm_redis_socket_vol:
  openvas_data_vol:
  openvas_log_data_vol:
