# --- Compose de USO: solo imagenes prearmadas -------------------------------------------------
# Cada servicio usa `image: ghcr.io/.../tero-<servicio>:${TERO_VERSION}` (registro privado de GHCR):
# `docker compose pull` + `docker compose up -d`, sin compilar nada en la PC.
# Para COMPILAR las imagenes (desarrollo, o sin acceso al registro) se suma docker-compose.dev.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml build
# TERO_VERSION: los lanzadores (.exe / tero-iniciar.sh) la toman del archivo VERSION.
# Ver docs/IMAGENES-GHCR.md.

# --- Endurecimiento comun (YAML anchors) -----------------------------------
# no-new-privileges: un proceso dentro del contenedor no puede ganar privilegios
#   via setuid/setcap aunque encuentre un binario con esos bits.
# cap_drop ALL: las APIs FastAPI no necesitan ninguna capability de Linux.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

x-api-hardening: &api-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# BIND_ADDR controla en que interfaz se publican los puertos de las APIs y el
# frontend. Default 127.0.0.1 = solo esta PC. Para exponerlo en la LAN poneme
# BIND_ADDR=0.0.0.0 en .env (y pone un firewall / reverse proxy con TLS delante).
# Postgres, Redis y OpenSearch no se publican en la PC: los servicios los usan por la red interna de Docker.

services:
  postgres:
    <<: *hardening
    restart: unless-stopped
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # SIN `ports`: los servicios llegan a Postgres por la red interna de Docker
    # (host "postgres", puerto 5432), asi que no hace falta publicarlo en la PC.
    # Publicarlo en 127.0.0.1:5432 hacia que `docker compose up` fallara con
    # "failed to bind host port 127.0.0.1:5432: address already in use" en
    # cualquier PC que ya tuviera un PostgreSQL instalado. Si algun dia hace
    # falta entrar con un cliente SQL desde la PC: `docker compose exec postgres
    # psql -U $POSTGRES_USER $POSTGRES_DB` (no necesita puerto publicado).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    <<: *hardening
    restart: unless-stopped
    image: redis:7.2-alpine
    # Redis exige contrasena (REDIS_PASSWORD, ver .env): sin esto, cualquier proceso
    # que llegara a la red interna podia leer/borrar los contadores del rate limiter.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Falta REDIS_PASSWORD en .env (ver .env.example)}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    # Sin `ports`: los servicios llegan a Redis por la red interna de Docker. Publicarlo en
    # 127.0.0.1:6379 chocaba ("port is already allocated") en PCs que ya usaban ese puerto
    # (un Redis propio, o un TERO anterior con otro nombre de proyecto).
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    <<: *hardening
    restart: unless-stopped
    image: opensearchproject/opensearch:2.16.0
    environment:
      - discovery.type=single-node
      # Seguridad ACTIVA (usuario "admin" + HTTPS con certificado interno). La contrasena
      # sale de OPENSEARCH_ADMIN_PASSWORD (.env); OpenSearch exige que sea fuerte
      # (mayuscula, minuscula, numero y simbolo) o se niega a arrancar.
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:?Falta OPENSEARCH_ADMIN_PASSWORD en .env (ver .env.example)}"
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    # Sin `ports`: los servicios llegan a OpenSearch por la red interna de Docker (puerto 9200).
    healthcheck:
      test: ["CMD-SHELL", "curl -sfk -u \"admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD\" https://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  auth-service:
    <<: *api-hardening
    restart: unless-stopped
    image: ${TERO_REGISTRY:-ghcr.io/ridioortv}/tero-auth-service:${TERO_VERSION:-local}
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8001:8000"

  asset-service:
    <<: *api-hardening
    restart: unless-stopped
    image: ${TERO_REGISTRY:-ghcr.io/ridioortv}/tero-asset-service:${TERO_VERSION:-local}
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8002:8000"


  scan-service:
    # SIN no-new-privileges (a proposito, no es un olvido): el binario de zeek tiene
    # capabilities de ARCHIVO (setcap cap_net_raw,cap_net_admin+eip, ver el
    # Dockerfile) para poder capturar paquetes corriendo como usuario no-root, y
    # no-new-privileges hace que el kernel IGNORE las capabilities de archivo
    # (zeek fallaba con "pcap_activate: Operation not permitted"). El resto del
    # endurecimiento (usuario no-root, puertos solo en 127.0.0.1) se mantiene.
    restart: unless-stopped
    image: ${TERO_REGISTRY:-ghcr.io/ridioortv}/tero-scan-service:${TERO_VERSION:-local}
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    volumes:
      # Cache de la DB de CVEs de trivy y de las plantillas de nuclei --
      # persistentes entre reinicios/rebuilds para que solo se paguen
      # una vez (ver Dockerfile y app/scanners/{trivy,nuclei}.py).
      - trivy_cache:/root/.cache/trivy
      - nuclei_templates:/root/nuclei-templates
    # Capabilities elevadas, SOLO para zeek/falco (ver app/scanners/zeek.py
    # y app/scanners/falco.py) -- ningun otro scanner de esta plataforma
    # las necesita. NET_RAW/NET_ADMIN: captura de paquetes en modo
    # promiscuo (zeek). SYS_PTRACE/SYS_ADMIN/SYS_RESOURCE + BPF/PERFMON:
    # cargar y correr el driver eBPF "moderno" de falco (requiere un
    # kernel con soporte BTF -- en Docker Desktop depende de la version/
    # el backend WSL2 vs Hyper-V; si el kernel del host no alcanza, falco
    # termina con un error claro al arrancar en vez de degradarse en
    # silencio, ver FalcoDriver.run). Decision de producto que acepta
    # este riesgo/complejidad de despliegue extra (Manu, 2026) a cambio
    # de sumar estos dos scanners -- si BPF/PERFMON no son reconocidos
    # por tu version de Docker Engine (nombres de capability mas nuevos,
    # Docker 20.10+), sacalos de esta lista; zeek sigue funcionando con
    # solo NET_RAW/NET_ADMIN.
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - SYS_PTRACE
      - SYS_ADMIN
      - SYS_RESOURCE
      - BPF
      - PERFMON
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8003:8000"

  # Agente de escaneo remoto que corre DENTRO del stack. Reusa la imagen de
  # scan-service (ya trae trivy/nuclei) y hace polling a scan-service
  # ejecutando los jobs asignados al "Agente Docker". Se auto-registra via
  # BOOTSTRAP_AGENTS (ver .env). Por el NAT de Docker Desktop solo llega a
  # internet y a la propia PC (host.docker.internal), NO a la LAN -- para
  # la LAN esta el agente de host (ver remote-agent/README.md). build con
  # el MISMO Dockerfile que scan-service: buildkit reusa toda la cache,
  # asi que no reconstruye nada pesado.
  remote-agent:
    # SIN no-new-privileges (a proposito, no es un olvido): el binario de zeek tiene
    # capabilities de ARCHIVO (setcap cap_net_raw,cap_net_admin+eip, ver el
    # Dockerfile) para poder capturar paquetes corriendo como usuario no-root, y
    # no-new-privileges hace que el kernel IGNORE las capabilities de archivo
    # (zeek fallaba con "pcap_activate: Operation not permitted"). El resto del
    # endurecimiento (usuario no-root, puertos solo en 127.0.0.1) se mantiene.
    restart: unless-stopped
    image: ${TERO_REGISTRY:-ghcr.io/ridioortv}/tero-scan-service:${TERO_VERSION:-local}
    command: ["python", "/agent.py"]
    environment:
      SCAN_SERVICE_URL: http://scan-service:8000
      AGENT_API_KEY: ${REMOTE_AGENT_DOCKER_KEY}
      POLL_INTERVAL_SECONDS: "10"
      # trivy/nuclei no tienen forma de atravesar el NAT de Docker Desktop
      # -- con esto en "1", un job de cualquiera de los 2 contra una IP de
      # LAN (192.168.x.x, 10.x.x.x, etc.) falla al toque con un mensaje
      # claro en vez de quedarse varios minutos intentando conectar.
      # Ver remote-agent/agent.py::_process_job.
      AGENT_BEHIND_DOCKER_NAT: "1"
      # Este agente corre con la MISMA imagen que scan-service (ver el
      # build de arriba), que ya trae horneadas las reglas propias de
      # semgrep/yara (ver Dockerfile, COPY rules/{semgrep,yara}) -- se
      # los apunta ahi en vez del default relativo "./rules/..." de
      # agent.py (pensado para cuando este script corre SUELTO en una
      # maquina sin ese build, ver remote-agent/README.md).
      SENTINELOPS_SEMGREP_RULES_DIR: /opt/sentinelops-semgrep-rules
      SENTINELOPS_YARA_RULES_FILE: /opt/sentinelops-yara-rules/sentinelops.yar
      SENTINELOPS_ZAP_HOME_DIR: /home/sentinelops/.ZAP
    # Capabilities elevadas, SOLO para zeek/falco (ver app/scanners/zeek.py
    # y app/scanners/falco.py) -- ningun otro scanner de esta plataforma
    # las necesita. NET_RAW/NET_ADMIN: captura de paquetes en modo
    # promiscuo (zeek). SYS_PTRACE/SYS_ADMIN/SYS_RESOURCE + BPF/PERFMON:
    # cargar y correr el driver eBPF "moderno" de falco (requiere un
    # kernel con soporte BTF -- en Docker Desktop depende de la version/
    # el backend WSL2 vs Hyper-V; si el kernel del host no alcanza, falco
    # termina con un error claro al arrancar en vez de degradarse en
    # silencio, ver FalcoDriver.run). Decision de producto que acepta
    # este riesgo/complejidad de despliegue extra (Manu, 2026) a cambio
    # de sumar estos dos scanners -- si BPF/PERFMON no son reconocidos
    # por tu version de Docker Engine (nombres de capability mas nuevos,
    # Docker 20.10+), sacalos de esta lista; zeek sigue funcionando con
    # solo NET_RAW/NET_ADMIN.
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - SYS_PTRACE
      - SYS_ADMIN
      - SYS_RESOURCE
      - BPF
      - PERFMON
    # No es un servidor web (corre agent.py, no uvicorn), asi que el healthcheck de la
    # imagen (HTTP) no aplica. Este revisa el "latido" del agente: lo actualiza cada vez que
    # le logra preguntar jobs a scan-service (ver agent.py::_touch_heartbeat), asi que figura
    # "healthy" solo si esta funcionando de verdad (scan-service alcanzable y api key valida).
    healthcheck:
      test: ["CMD", "python", "/agent.py", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./remote-agent/agent.py:/agent.py:ro
    depends_on:
      scan-service:
        condition: service_healthy

  # Agente WAN (internet): tercer agente "siempre encendido" del stack, junto
  # al Agente Docker y al Agente LAN. Escanea SOLO objetivos publicos de
  # internet (AGENT_ROLE=wan): rechaza al toque IPs privadas/internas
  # (192.168.x.x, 10.x.x.x, localhost, host.docker.internal...) y los scanners
  # que no aplican a internet (zeek/falco/yara) -- ver
  # remote-agent/agent.py::_wan_rejection. Por eso NO lleva las capabilities
  # elevadas de zeek/falco que si tiene remote-agent: minimo privilegio.
  # Misma imagen que scan-service (trae trivy/nuclei/zap/semgrep/gitleaks).
  # Se auto-registra via BOOTSTRAP_AGENTS (ver .env, REMOTE_AGENT_WAN_KEY).
  remote-agent-wan:
    <<: *hardening
    restart: unless-stopped
    image: ${TERO_REGISTRY:-ghcr.io/ridioortv}/tero-scan-service:${TERO_VERSION:-local}
    command: ["python", "/agent.py"]
    environment:
      SCAN_SERVICE_URL: http://scan-service:8000
      AGENT_API_KEY: ${REMOTE_AGENT_WAN_KEY}
      POLL_INTERVAL_SECONDS: "10"
      AGENT_ROLE: wan
      AGENT_BEHIND_DOCKER_NAT: "1"
      SENTINELOPS_SEMGREP_RULES_DIR: /opt/sentinelops-semgrep-rules
      SENTINELOPS_YARA_RULES_FILE: /opt/sentinelops-yara-rules/sentinelops.yar
      SENTINELOPS_ZAP_HOME_DIR: /home/sentinelops/.ZAP
    healthcheck:
      test: ["CMD", "python", "/agent.py", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./remote-agent/agent.py:/agent.py:ro
    depends_on:
      scan-service:
        condition: service_healthy

  vuln-service:
    <<: *api-hardening
    restart: unless-stopped
    image: ${TERO_REGISTRY:-ghcr.io/ridioortv}/tero-vuln-service:${TERO_VERSION:-local}
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8004:8000"

  siem-service:
    <<: *api-hardening
    restart: unless-stopped
    image: ${TERO_REGISTRY:-ghcr.io/ridioortv}/tero-siem-service:${TERO_VERSION:-local}
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_USE_SSL: "true"
      SOAR_SERVICE_URL: http://soar-service:8000
      THREATINTEL_SERVICE_URL: http://threatintel-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # service_started (no service_healthy): siem-service ya tolera que
      # OpenSearch tarde en estar listo (ver el try/except en su lifespan),
      # asi que no tiene sentido que el resto de la plataforma (via
      # frontend, que depende de siem-service) se quede bloqueada
      # esperando a que OpenSearch pase su healthcheck -- que es lento y
      # pesado en memoria, sobre todo mientras arrancan otros 14
      # contenedores a la vez.
      opensearch:
        condition: service_started
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8005:8000"

  soar-service:
    <<: *api-hardening
    restart: unless-stopped
    image: ${TERO_REGISTRY:-ghcr.io/ridioortv}/tero-soar-service:${TERO_VERSION:-local}
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      SOAR_DRY_RUN: "true"
      CASE_SERVICE_URL: http://case-service:8000
      INTEGRATION_SERVICE_URL: http://integration-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      notification-service:
        condition: service_started
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8006:8000"

  case-service:
    <<: *api-hardening
    restart: unless-stopped
    image: ${TERO_REGISTRY:-ghcr.io/ridioortv}/tero-case-service:${TERO_VERSION:-local}
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      SOAR_SERVICE_URL: http://soar-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8007:8000"

  purple-service:
    <<: *api-hardening
    restart: unless-stopped
    image: ${TERO_REGISTRY:-ghcr.io/ridioortv}/tero-purple-service:${TERO_VERSION:-local}
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      SIEM_SERVICE_URL: http://siem-service:8000
      CASE_SERVICE_URL: http://case-service:8000
      SOAR_SERVICE_URL: http://soar-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8008:8000"

  report-service:
    <<: *api-hardening
    restart: unless-stopped
    image: ${TERO_REGISTRY:-ghcr.io/ridioortv}/tero-report-service:${TERO_VERSION:-local}
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      VULN_SERVICE_URL: http://vuln-service:8000
      SIEM_SERVICE_URL: http://siem-service:8000
      CASE_SERVICE_URL: http://case-service:8000
      PURPLE_SERVICE_URL: http://purple-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      notification-service:
        condition: service_started
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8009:8000"

  notification-service:
    <<: *api-hardening
    restart: unless-stopped
    image: ${TERO_REGISTRY:-ghcr.io/ridioortv}/tero-notification-service:${TERO_VERSION:-local}
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      NOTIFICATION_DRY_RUN: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8010:8000"

  integration-service:
    <<: *api-hardening
    restart: unless-stopped
    image: ${TERO_REGISTRY:-ghcr.io/ridioortv}/tero-integration-service:${TERO_VERSION:-local}
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      INTEGRATION_DRY_RUN: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8011:8000"

  threatintel-service:
    <<: *api-hardening
    restart: unless-stopped
    image: ${TERO_REGISTRY:-ghcr.io/ridioortv}/tero-threatintel-service:${TERO_VERSION:-local}
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8012:8000"

  asm-service:
    <<: *api-hardening
    restart: unless-stopped
    image: ${TERO_REGISTRY:-ghcr.io/ridioortv}/tero-asm-service:${TERO_VERSION:-local}
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8013:8000"

  cloud-service:
    <<: *api-hardening
    restart: unless-stopped
    image: ${TERO_REGISTRY:-ghcr.io/ridioortv}/tero-cloud-service:${TERO_VERSION:-local}
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8014:8000"

  coderepo-service:
    <<: *hardening
    restart: unless-stopped
    image: ${TERO_REGISTRY:-ghcr.io/ridioortv}/tero-coderepo-service:${TERO_VERSION:-local}
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    volumes:
      # Cache de la DB de CVEs de trivy -- PROPIO de este servicio, nunca
      # el `trivy_cache` de scan-service (dos contenedores escribiendo la
      # misma cache de trivy en simultaneo puede corromper el archivo
      # bolt de la DB). Ver Dockerfile y app/services.py.
      - coderepo_trivy_cache:/root/.cache/trivy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8015:8000"

  frontend:
    <<: *hardening
    restart: unless-stopped
    image: ${TERO_REGISTRY:-ghcr.io/ridioortv}/tero-frontend:${TERO_VERSION:-local}
    # Sin env_file: el contenedor estatico no necesita ningun secreto (antes
    # recibia JWT_SECRET_KEY, claves de agentes, etc. en su entorno).
    depends_on:
      - auth-service
      - asset-service
      - scan-service
      - vuln-service
      - siem-service
      - soar-service
      - case-service
      - purple-service
      - report-service
      - notification-service
      - integration-service
      - threatintel-service
      - asm-service
      - cloud-service
      - coderepo-service
    ports:
      - "${BIND_ADDR:-127.0.0.1}:5173:8080"

networks:
  default: {}

volumes:
  pgdata:
  # scan-service: cache persistente de trivy/nuclei (ver Dockerfile y
  # app/scanners/{trivy,nuclei}.py)
  trivy_cache:
  nuclei_templates:
  # coderepo-service: cache persistente de trivy, PROPIA (nunca se
  # comparte con scan-service, ver docstring del servicio arriba)
  coderepo_trivy_cache: