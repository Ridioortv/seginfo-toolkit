services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    restart: unless-stopped
    image: opensearchproject/opensearch:2.16.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  auth-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/auth-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"

  asset-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/asset-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8002:8000"


  # --- OpenVAS/GVM (Greenbone Community Edition), subset headless -------
  # Adaptado del compose.yaml oficial de Greenbone
  # (https://greenbone.github.io/docs/latest/_static/compose.yaml),
  # excluyendo gsa/gsad/gvm-config/nginx (la GUI web -- no la necesitamos,
  # scan-service habla GMP directo contra el socket de gvmd via gvm-cli)
  # y gvm-tools (ya instalamos ese mismo paquete pip, gvm-tools, DENTRO
  # de scan-service -- no necesitamos un contenedor CLI aparte).
  #
  # Primer arranque: la sincronizacion inicial del feed de NVTs (via
  # vulnerability-tests/notus-data/scap-data/etc, cada uno con
  # KEEP_ALIVE: 1 para quedarse corriendo hasta que gvmd los de por
  # completos via su healthcheck) puede tardar bastante (horas, varios
  # GB) la primera vez. Ver README/STATUS.md para el paso manual de
  # bootstrap del usuario admin (docker compose exec -u gvmd gvmd gvmd
  # --user=admin --new-password=...).
  vulnerability-tests:
    profiles: ["openvas"]
    image: registry.community.greenbone.net/community/vulnerability-tests
    environment:
      FEED_RELEASE: "24.10"
      KEEP_ALIVE: 1
    volumes:
      - vt_data_vol:/mnt
    networks:
      - gvm_internal

  notus-data:
    profiles: ["openvas"]
    image: registry.community.greenbone.net/community/notus-data
    environment:
      KEEP_ALIVE: 1
    volumes:
      - notus_data_vol:/mnt
    networks:
      - gvm_internal

  scap-data:
    profiles: ["openvas"]
    image: registry.community.greenbone.net/community/scap-data
    environment:
      KEEP_ALIVE: 1
    volumes:
      - scap_data_vol:/mnt
    networks:
      - gvm_internal

  cert-bund-data:
    profiles: ["openvas"]
    image: registry.community.greenbone.net/community/cert-bund-data
    environment:
      KEEP_ALIVE: 1
    volumes:
      - cert_data_vol:/mnt
    networks:
      - gvm_internal

  dfn-cert-data:
    profiles: ["openvas"]
    image: registry.community.greenbone.net/community/dfn-cert-data
    environment:
      KEEP_ALIVE: 1
    volumes:
      - cert_data_vol:/mnt
    depends_on:
      cert-bund-data:
        condition: service_healthy
    networks:
      - gvm_internal

  data-objects:
    profiles: ["openvas"]
    image: registry.community.greenbone.net/community/data-objects
    environment:
      FEED_RELEASE: "24.10"
      KEEP_ALIVE: 1
    volumes:
      - data_objects_vol:/mnt
    networks:
      - gvm_internal

  report-formats:
    profiles: ["openvas"]
    image: registry.community.greenbone.net/community/report-formats
    environment:
      FEED_RELEASE: "24.10"
      KEEP_ALIVE: 1
    volumes:
      - data_objects_vol:/mnt
    depends_on:
      data-objects:
        condition: service_healthy
    networks:
      - gvm_internal

  gpg-data:
    profiles: ["openvas"]
    image: registry.community.greenbone.net/community/gpg-data
    volumes:
      - gpg_data_vol:/mnt
    networks:
      - gvm_internal

  gvm-redis:
    profiles: ["openvas"]
    # Redis PROPIO de GVM/ospd-openvas -- servicio y nombre distintos del
    # `redis` que ya usa el resto de SentinelOps (sin colision: cada uno
    # con su propio volumen de socket unix, ninguno expone puerto TCP).
    image: registry.community.greenbone.net/community/redis-server
    restart: unless-stopped
    volumes:
      - gvm_redis_socket_vol:/run/redis/
    networks:
      - gvm_internal

  pg-gvm:
    profiles: ["openvas"]
    image: registry.community.greenbone.net/community/pg-gvm:stable
    restart: unless-stopped
    volumes:
      - gvm_psql_data_vol:/var/lib/postgresql
      - gvm_psql_socket_vol:/var/run/postgresql
    depends_on:
      pg-gvm-migrator:
        condition: service_completed_successfully
    networks:
      - gvm_internal

  pg-gvm-migrator:
    profiles: ["openvas"]
    image: registry.community.greenbone.net/community/pg-gvm-migrator:stable
    volumes:
      - gvm_psql_data_vol:/var/lib/postgresql
      - gvm_psql_socket_vol:/var/run/postgresql
    networks:
      - gvm_internal

  gvmd:
    profiles: ["openvas"]
    image: registry.community.greenbone.net/community/gvmd:stable
    restart: unless-stopped
    volumes:
      - gvmd_data_vol:/var/lib/gvm
      - scap_data_vol:/var/lib/gvm/scap-data/
      - cert_data_vol:/var/lib/gvm/cert-data
      - data_objects_vol:/var/lib/gvm/data-objects/gvmd
      - vt_data_vol:/var/lib/openvas/plugins
      - gvm_psql_data_vol:/var/lib/postgresql
      - gvmd_socket_vol:/run/gvmd
      - ospd_openvas_socket_vol:/run/ospd
      - gvm_psql_socket_vol:/var/run/postgresql
    depends_on:
      pg-gvm:
        condition: service_started
      scap-data:
        condition: service_healthy
      cert-bund-data:
        condition: service_healthy
      dfn-cert-data:
        condition: service_healthy
      data-objects:
        condition: service_healthy
      report-formats:
        condition: service_healthy
    networks:
      - gvm_internal

  configure-openvas:
    profiles: ["openvas"]
    image: registry.community.greenbone.net/community/openvas-scanner:stable
    volumes:
      - openvas_data_vol:/mnt
      - openvas_log_data_vol:/var/log/openvas
    command:
      - /bin/sh
      - -c
      - |
        printf "table_driven_lsc = yes\nopenvasd_server = http://openvasd:80\n" > /mnt/openvas.conf
        sed "s/127/128/" /etc/openvas/openvas_log.conf | sed 's/gvm/openvas/' > /mnt/openvas_log.conf
        chmod 644 /mnt/openvas.conf
        chmod 644 /mnt/openvas_log.conf
        touch /var/log/openvas/openvas.log
        chmod 666 /var/log/openvas/openvas.log
    networks:
      - gvm_internal

  openvas:
    profiles: ["openvas"]
    image: registry.community.greenbone.net/community/openvas-scanner:stable
    volumes:
      - openvas_data_vol:/etc/openvas
      - openvas_log_data_vol:/var/log/openvas
    command:
      - /bin/sh
      - -c
      - |
        cat /etc/openvas/openvas.conf
        tail -f /var/log/openvas/openvas.log
    depends_on:
      configure-openvas:
        condition: service_completed_successfully
    networks:
      - gvm_internal

  openvasd:
    profiles: ["openvas"]
    image: registry.community.greenbone.net/community/openvas-scanner:stable
    restart: unless-stopped
    environment:
      OPENVASD_MODE: service_notus
      GNUPGHOME: /etc/openvas/gnupg
      LISTENING: 0.0.0.0:80
    volumes:
      - openvas_data_vol:/etc/openvas
      - openvas_log_data_vol:/var/log/openvas
      - gpg_data_vol:/etc/openvas/gnupg
      - notus_data_vol:/var/lib/notus
    depends_on:
      vulnerability-tests:
        condition: service_healthy
      notus-data:
        condition: service_healthy
      configure-openvas:
        condition: service_completed_successfully
      gpg-data:
        condition: service_completed_successfully
    networks:
      - gvm_internal

  ospd-openvas:
    profiles: ["openvas"]
    # NET_ADMIN/NET_RAW + seccomp/apparmor sin confinar son ineliminables:
    # el motor openvas-scanner arma paquetes crudos el mismo (sockets raw,
    # ICMP, IP_HDRINCL) para descubrimiento/fingerprinting de host, y esos
    # syscalls estan bloqueados por el perfil seccomp default de Docker y
    # por AppArmor -- asi lo requiere el propio compose oficial de
    # Greenbone, sin perfil scoped alternativo documentado. Sacarlos rompe
    # el escaner. Lo que SI se puede (y se hizo) para achicar el impacto
    # de una eventual falla de este contenedor puntual, sin tocar esas dos
    # capacidades:
    #   - no-new-privileges: bloquea escalar privilegios via setuid/setgid
    #     en cualquier binario que corra adentro, independiente del
    #     seccomp/apparmor sin confinar.
    #   - red `gvm_internal` (ver el bloque `networks:` al final del
    #     archivo): este contenedor y todo el resto del stack GVM quedan
    #     en una red Docker propia, sin salida a internet y sin camino de
    #     red hacia postgres/redis/el resto de los microservicios de
    #     SentinelOps -- scan-service habla con gvmd por un socket unix
    #     montado (volumen), no por red, asi que no hace falta compartir
    #     red con el.
    # (cap_drop: ALL quedo afuera a proposito: no puedo levantar este
    # contenedor desde aca para confirmar que el entrypoint de la imagen
    # no necesita algun otro capability de los que trae Docker por
    # default -- ej. CHOWN/SETUID al arrancar -- y romper el arranque a
    # ciegas es peor que dejar el set default + estas dos agregadas,
    # que es exactamente lo que testea el compose oficial de Greenbone.)
    image: registry.community.greenbone.net/community/ospd-openvas:stable
    restart: unless-stopped
    hostname: ospd-openvas.local
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - no-new-privileges:true
    command:
      [
        "ospd-openvas",
        "-f",
        "--config",
        "/etc/gvm/ospd-openvas.conf",
        "--notus-feed-dir",
        "/var/lib/notus/advisories",
        "-m",
        "666",
      ]
    volumes:
      - gpg_data_vol:/etc/openvas/gnupg
      - vt_data_vol:/var/lib/openvas/plugins
      - notus_data_vol:/var/lib/notus
      - ospd_openvas_socket_vol:/run/ospd
      - gvm_redis_socket_vol:/run/redis/
      - openvas_data_vol:/etc/openvas/
      - openvas_log_data_vol:/var/log/openvas
    depends_on:
      gvm-redis:
        condition: service_started
      gpg-data:
        condition: service_completed_successfully
      configure-openvas:
        condition: service_completed_successfully
      vulnerability-tests:
        condition: service_healthy
      notus-data:
        condition: service_healthy
    networks:
      - gvm_internal
      - gvm_scan_egress

  scan-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/scan-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      GVM_SOCKET_PATH: /run/gvmd/gvmd.sock
      # Sidecar con acceso al socket de Docker que levanta el profile
      # "openvas" a pedido (ver openvas-orchestrator/main.py y el boton
      # "Probar y activar" -> POST /openvas/auto-activate). scan-service
      # NUNCA toca el socket de Docker el mismo -- solo le pega a este
      # servicio interno via la red default de compose (sin puerto publicado).
      OPENVAS_ORCHESTRATOR_URL: http://openvas-orchestrator:8000
    volumes:
      # Cache de la DB de CVEs de trivy y de las plantillas de nuclei --
      # persistentes entre reinicios/rebuilds para que solo se paguen
      # una vez (ver Dockerfile y app/scanners/{trivy,nuclei}.py).
      - trivy_cache:/root/.cache/trivy
      - nuclei_templates:/root/nuclei-templates
      # Socket unix de gvmd para hablar GMP via gvm-cli (ver
      # app/scanners/openvas.py). Montado read-only: scan-service es un
      # cliente, no administra gvmd.
      - gvmd_socket_vol:/run/gvmd:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8003:8000"

  # Sidecar de activacion automatica de OpenVAS ("Probar y activar" con
  # barra de progreso, ver frontend/src/pages/Scans.tsx y main.py::
  # openvas_auto_activate). Es el UNICO servicio de todo SentinelOps con
  # acceso al socket de Docker -- necesario para poder levantar el profile
  # "openvas" (16 contenedores) el mismo en vez de que el operador corra
  # openvas/Encender-OpenVAS.ps1 a mano. Para acotar el riesgo que eso
  # agrega:
  #   - No tiene puerto publicado: solo se alcanza en
  #     http://openvas-orchestrator:8000 desde dentro de la red default
  #     de compose (scan-service es el unico que le habla).
  #   - Expone nada mas 2 endpoints (POST /start, GET /status, ver
  #     openvas-orchestrator/main.py) -- no hay forma de pedirle acciones
  #     arbitrarias de Docker via su API.
  #   - Solo monta el socket de Docker + este mismo docker-compose.yml y
  #     .env (de solo lectura via docker compose, necesita escribir .env
  #     para guardar las credenciales GVM) -- no monta el resto del repo.
  #   - NO esta en gvm_internal: no tiene ningun camino de red hacia
  #     gvmd/ospd-openvas, solo orquesta sus contenedores via el CLI de
  #     Docker.
  openvas-orchestrator:
    restart: unless-stopped
    build:
      context: .
      dockerfile: openvas-orchestrator/Dockerfile
    environment:
      COMPOSE_PROJECT_NAME: seginfo-toolkit
      COMPOSE_PROJECT_DIR: /workspace
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/workspace/docker-compose.yml
      - ./.env:/workspace/.env

  # Agente de escaneo remoto que corre DENTRO del stack. Reusa la imagen de
  # scan-service (ya trae nmap/trivy/nuclei + gvm-cli) y hace polling a
  # scan-service ejecutando los jobs asignados al "Agente Docker". Se
  # auto-registra via BOOTSTRAP_AGENTS (ver .env). Por el NAT de Docker
  # Desktop solo llega a internet y a la propia PC (host.docker.internal),
  # NO a la LAN -- para la LAN esta el agente de host (ver remote-agent/
  # README.md). build con el MISMO Dockerfile que scan-service: buildkit
  # reusa toda la cache, asi que no reconstruye nada pesado.
  remote-agent:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/scan-service/Dockerfile
    command: ["python", "/agent.py"]
    environment:
      SCAN_SERVICE_URL: http://scan-service:8000
      AGENT_API_KEY: ${REMOTE_AGENT_DOCKER_KEY}
      POLL_INTERVAL_SECONDS: "10"
      # Usa el escaner TCP interno (connect) en vez del binario nmap: connect()
      # atraviesa el NAT de Docker Desktop, asi el Agente Docker puede escanear
      # la LAN real (nmap normal falla por su descubrimiento ICMP/ARP).
      AGENT_FORCE_INTERNAL_NMAP: "1"
      # A diferencia de nmap (ver arriba), trivy/nuclei/openvas NO tienen forma
      # de atravesar el NAT de Docker Desktop -- con esto en "1", un job de
      # alguno de esos 3 contra una IP de LAN (192.168.x.x, 10.x.x.x, etc.)
      # falla al toque con un mensaje claro en vez de quedarse varios minutos
      # intentando conectar. Ver remote-agent/agent.py::_process_job.
      AGENT_BEHIND_DOCKER_NAT: "1"
    # No es un servidor web (corre agent.py, no uvicorn), asi que el
    # healthcheck de la imagen no aplica -> lo desactivamos para que no
    # figure "unhealthy".
    healthcheck:
      disable: true
    volumes:
      - ./remote-agent/agent.py:/agent.py:ro
    depends_on:
      scan-service:
        condition: service_healthy

  # Agente dedicado a OpenVAS ("gvm" en el selector de agente de la UI).
  # A diferencia de "remote-agent" (Agente Docker) de arriba, que NO tiene
  # ni el socket ni las credenciales de gvmd, este SI se conecta al MISMO
  # gvmd/ospd-openvas de este stack (montando el mismo socket que ya usa
  # scan-service, gvmd_socket_vol) -- asi que no necesita el motor GVM
  # aparte en ninguna otra maquina: reusa el que ya levanta el profile
  # "openvas" en este mismo docker-compose.yml.
  #
  # A proposito NO se setea AGENT_BEHIND_DOCKER_NAT aca: ese flag frena
  # trivy/nuclei/openvas contra IPs de LAN (ver remote-agent, arriba), pero
  # desde el fix de alive_tests="Consider Alive" (app/scanners/openvas.py
  # y remote-agent/agent.py::run_openvas, commit 58396b1) un escaneo real
  # de openvas YA puede llegar a la LAN sin ping/ARP -- bloquearlo aca de
  # nuevo anularia ese fix. Nota: este agente SI podria recibir por error
  # un job de nmap/nuclei/trivy (el modelo de agentes no restringe por
  # scanner) -- contra un target de LAN esos tres se quedarian intentando
  # hasta su propio timeout en vez de fallar al toque, por no tener ese
  # guard; en la practica no deberia pasar porque los otros dos agentes
  # (LAN/Docker) ya cubren esos 3 scanners.
  gvm-agent:
    profiles: ["openvas"]
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/scan-service/Dockerfile
    command: ["python", "/agent.py"]
    environment:
      SCAN_SERVICE_URL: http://scan-service:8000
      AGENT_API_KEY: ${REMOTE_AGENT_GVM_KEY}
      POLL_INTERVAL_SECONDS: "10"
      GVM_SOCKET_PATH: /run/gvmd/gvmd.sock
      GVM_USER: ${GVM_USER}
      GVM_PASSWORD: ${GVM_PASSWORD}
    healthcheck:
      disable: true
    volumes:
      - ./remote-agent/agent.py:/agent.py:ro
      - gvmd_socket_vol:/run/gvmd:ro
    depends_on:
      scan-service:
        condition: service_healthy
      gvmd:
        condition: service_started

  vuln-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/vuln-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8004:8000"

  siem-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/siem-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      OPENSEARCH_HOST: opensearch
      SOAR_SERVICE_URL: http://soar-service:8000
      THREATINTEL_SERVICE_URL: http://threatintel-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # service_started (no service_healthy): siem-service ya tolera que
      # OpenSearch tarde en estar listo (ver el try/except en su lifespan),
      # asi que no tiene sentido que el resto de la plataforma (via
      # frontend, que depende de siem-service) se quede bloqueada
      # esperando a que OpenSearch pase su healthcheck -- que es lento y
      # pesado en memoria, sobre todo mientras arrancan otros 14
      # contenedores a la vez.
      opensearch:
        condition: service_started
    ports:
      - "8005:8000"

  soar-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/soar-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      SOAR_DRY_RUN: "true"
      CASE_SERVICE_URL: http://case-service:8000
      INTEGRATION_SERVICE_URL: http://integration-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      notification-service:
        condition: service_started
    ports:
      - "8006:8000"

  case-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/case-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      SOAR_SERVICE_URL: http://soar-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8007:8000"

  purple-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/purple-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      SIEM_SERVICE_URL: http://siem-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8008:8000"

  report-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/report-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      VULN_SERVICE_URL: http://vuln-service:8000
      SIEM_SERVICE_URL: http://siem-service:8000
      CASE_SERVICE_URL: http://case-service:8000
      PURPLE_SERVICE_URL: http://purple-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      notification-service:
        condition: service_started
    ports:
      - "8009:8000"

  notification-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/notification-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      NOTIFICATION_DRY_RUN: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8010:8000"

  integration-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/integration-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      INTEGRATION_DRY_RUN: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8011:8000"

  threatintel-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/threatintel-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8012:8000"

  asm-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/asm-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8013:8000"

  cloud-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/cloud-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8014:8000"

  coderepo-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/services/coderepo-service/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    volumes:
      # Cache de la DB de CVEs de trivy -- PROPIO de este servicio, nunca
      # el `trivy_cache` de scan-service (dos contenedores escribiendo la
      # misma cache de trivy en simultaneo puede corromper el archivo
      # bolt de la DB). Ver Dockerfile y app/services.py.
      - coderepo_trivy_cache:/root/.cache/trivy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8015:8000"

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
    env_file: .env
    depends_on:
      - auth-service
      - asset-service
      - scan-service
      - vuln-service
      - siem-service
      - soar-service
      - case-service
      - purple-service
      - report-service
      - notification-service
      - integration-service
      - threatintel-service
      - asm-service
      - cloud-service
      - coderepo-service
    ports:
      - "5173:5173"

networks:
  default: {}
  # Red interna dedicada para todo el stack GVM/OpenVAS -- ningun otro
  # servicio de SentinelOps (postgres, redis, el resto de microservicios)
  # comparte esta red. scan-service NO la necesita: habla con gvmd via el
  # socket unix montado (gvmd_socket_vol), no por red. `internal: true`
  # ademas le saca conectividad de salida a internet -- los datos de feed
  # ya vienen empaquetados en las imagenes de los populadores, no se
  # descargan en runtime. Asi, si ospd-openvas (el unico contenedor con
  # NET_ADMIN/NET_RAW + seccomp/apparmor sin confinar) se ve comprometido,
  # no tiene ningun camino de red hacia el resto de la plataforma.
  gvm_internal:
    internal: true
  # Red separada, CON salida real (sin `internal: true`), dedicada
  # EXCLUSIVAMENTE a que ospd-openvas pueda llegar a los targets reales
  # que escanea (LAN/internet). Ningun otro servicio de SentinelOps se
  # conecta a esta red, asi que sigue sin existir ningun camino nuevo
  # hacia postgres/redis/el resto de los microservicios -- el
  # aislamiento de gvm_internal (mas arriba) se mantiene intacto para
  # eso. Sin esta red, ospd-openvas (el unico contenedor que manda los
  # paquetes crudos del escaneo real, ver NET_ADMIN/NET_RAW mas abajo)
  # quedaba con CERO salida de red: la creacion de target/task via GMP
  # (por el socket unix) andaba bien, pero el escaneo de verdad nunca
  # podia salir a tocar ningun host -- ni de LAN ni de internet.
  gvm_scan_egress: {}

volumes:
  pgdata:
  # scan-service: cache persistente de trivy/nuclei (ver Dockerfile y
  # app/scanners/{trivy,nuclei}.py)
  trivy_cache:
  nuclei_templates:
  # coderepo-service: cache persistente de trivy, PROPIA (nunca se
  # comparte con scan-service, ver docstring del servicio arriba)
  coderepo_trivy_cache:
  # OpenVAS/GVM (Greenbone Community Edition, subset headless)
  gpg_data_vol:
  scap_data_vol:
  cert_data_vol:
  data_objects_vol:
  gvmd_data_vol:
  gvm_psql_data_vol:
  vt_data_vol:
  notus_data_vol:
  gvm_psql_socket_vol:
  gvmd_socket_vol:
  ospd_openvas_socket_vol:
  gvm_redis_socket_vol:
  openvas_data_vol:
  openvas_log_data_vol:
