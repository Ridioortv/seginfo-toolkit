# Para produccion se recomienda un servicio administrado (Amazon
# OpenSearch Service) en vez de este Deployment de nodo unico -- ver
# infra/terraform.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch
  namespace: sentinelops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch
  template:
    metadata:
      labels:
        app: opensearch
    spec:
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.16.0
          env:
            - name: discovery.type
              value: "single-node"
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          ports:
            - containerPort: 9200
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: sentinelops
spec:
  selector:
    app: opensearch
  ports:
    - port: 9200
      targetPort: 9200
