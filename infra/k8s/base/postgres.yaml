# Para produccion se recomienda un Postgres administrado (RDS/Cloud SQL,
# ver infra/terraform) en vez de este StatefulSet -- se incluye para que
# el manifiesto sea auto-contenido en un cluster de desarrollo/demo.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: sentinelops
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: sentinelops-config
            - secretRef:
                name: sentinelops-secrets
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "sentinelops"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sentinelops
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
