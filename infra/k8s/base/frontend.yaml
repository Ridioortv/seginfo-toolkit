apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: sentinelops
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: sentinelops/frontend:latest
          ports:
            - containerPort: 5173
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: sentinelops
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 5173
