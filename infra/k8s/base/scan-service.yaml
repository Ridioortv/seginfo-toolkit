apiVersion: apps/v1
kind: Deployment
metadata:
  name: scan-service
  namespace: sentinelops
  labels:
    app: scan-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scan-service
  template:
    metadata:
      labels:
        app: scan-service
    spec:
      containers:
        - name: scan-service
          image: sentinelops/scan-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: sentinelops-config
            - secretRef:
                name: sentinelops-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: scan-service
  namespace: sentinelops
spec:
  selector:
    app: scan-service
  ports:
    - port: 8000
      targetPort: 8000
