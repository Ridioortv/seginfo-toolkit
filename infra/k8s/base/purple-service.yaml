apiVersion: apps/v1
kind: Deployment
metadata:
  name: purple-service
  namespace: sentinelops
  labels:
    app: purple-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: purple-service
  template:
    metadata:
      labels:
        app: purple-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001   # usuario 'sentinelops' de los Dockerfiles
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: purple-service
          image: sentinelops/purple-service:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: sentinelops-config
            - secretRef:
                name: sentinelops-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: purple-service
  namespace: sentinelops
spec:
  selector:
    app: purple-service
  ports:
    - port: 8000
      targetPort: 8000
