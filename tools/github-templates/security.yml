name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"   # semanal: detecta CVEs nuevas aunque no haya commits
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  sast-python:
    name: SAST Python (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install bandit==1.8.3
      - name: Bandit (falla con severidad ALTA; B608/B101 son falsos positivos conocidos)
        run: |
          bandit -r backend licensing-server remote-agent \
            -x '*/tests/*,remote-agent/test_*' -lll -q

  deps-python:
    name: Dependencias Python (pip-audit, con transitivas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit==2.9.0
      - name: Auditar cada requirements*.txt resolviendo tambien las dependencias transitivas
        # PYSEC-2026-1325 (ecdsa, CVE-2024-23342): ataque de timing en la FIRMA ECDSA P-256.
        # Aca solo se firma con HS256 (HMAC), nunca con ECDSA, y no hay version corregida:
        # riesgo aceptado y documentado en docs/security-hardening.md.
        # GHSA-3qf3-8w2g-rqmx (python-jose, confusion de algoritmo): sin version corregida.
        # Mitigado: todo jwt.decode fija algorithms=[...] (HS256 con secreto aleatorio en
        # shared/security.py; asimetrico tomado del JWKS en auth-service/app/oidc.py,
        # con test de regresion). Pendiente: migrar a PyJWT/authlib (docs/security-hardening.md).
        run: |
          status=0
          for f in backend/services/*/requirements*.txt licensing-server/requirements.txt remote-agent/requirements.txt; do
            [ -f "$f" ] || continue
            echo "== $f =="
            pip-audit -r "$f" --progress-spinner off --ignore-vuln PYSEC-2026-1325 --ignore-vuln GHSA-3qf3-8w2g-rqmx || status=1
          done
          exit $status

  deps-node:
    name: Dependencias Node (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Dependencias de produccion (falla con severidad alta o critica)
        run: npm audit --omit=dev --audit-level=high
      - name: Dependencias de desarrollo (informativo)
        run: npm audit --audit-level=critical
        continue-on-error: true

  trivy:
    name: Trivy (secretos y configuracion de la app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Secretos + misconfiguracion (Dockerfiles/compose) - BLOQUEANTE
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-dirs: "sentinel para sofi,node_modules_leftover_test,docs,infra"

  trivy-informativo:
    name: Trivy (vulnerabilidades e infra, informativo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # infra/terraform e infra/k8s son plantillas de despliegue cloud aun sin
      # usar (ver docs/security-hardening.md): se reportan pero no bloquean.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          skip-dirs: "sentinel para sofi,node_modules_leftover_test,docs"

  hadolint:
    name: Dockerfiles (hadolint)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - backend/services/auth-service/Dockerfile
          - backend/services/scan-service/Dockerfile
          - backend/services/coderepo-service/Dockerfile
          - frontend/Dockerfile
          - licensing-server/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: error

  codeql:
    name: CodeQL (SAST Python y TypeScript)
    # En repos privados CodeQL requiere GitHub Advanced Security; si el repo
    # es privado sin esa licencia el job se omite en vez de fallar.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4

  dependency-review:
    name: Revision de dependencias nuevas (PR)
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
