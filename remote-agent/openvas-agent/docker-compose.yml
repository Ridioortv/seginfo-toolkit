# Agente OpenVAS -- bundle standalone (gvmd + ospd-openvas + feeds
# propios), COMPLETAMENTE separado del stack principal de SentinelOps,
# pensado para dar escaneos reales de OpenVAS con visibilidad de red
# genuina sobre una LAN.
#
# Por que existe: en el stack principal (docker-compose.yml de la raiz
# del repo, perfil "openvas"), gvmd/ospd-openvas corren atras del NAT de
# Docker Desktop (Windows/Mac) -- no ven la LAN real de la oficina/
# cliente, el mismo motivo por el que existe remote-agent/agente-lan.ps1
# para nmap. A diferencia de nmap (que tiene un fallback por connect()
# que SI atraviesa ese NAT, ver remote-agent/agent.py::
# _run_python_portscan), el motor OpenVAS/Greenbone arma sus propios
# paquetes de red (ICMP, ARP, raw sockets) -- no hay forma de
# "tunelearlo" desde adentro de una VM de Docker Desktop.
#
# Esta carpeta empaqueta el MISMO stack GVM del proyecto principal, pero
# solo, para desplegar en una maquina LINUX (fisica, VM, mini-PC, un
# servidor del cliente) que SI tenga visibilidad de red real. Se registra
# como un agente MAS en "Escaneos" -> "Agentes de escaneo remoto" de la
# UI de SentinelOps -- convive con el Agente LAN y el Agente Docker, sin
# reemplazar a ninguno; el selector de agente de cada escaneo decide cual
# recibe cada job.
#
# Ver README.md en esta misma carpeta para los pasos de instalacion.
services:
  vulnerability-tests:
    image: registry.community.greenbone.net/community/vulnerability-tests
    environment:
      FEED_RELEASE: "24.10"
      KEEP_ALIVE: 1
    volumes:
      - vt_data_vol:/mnt
    networks:
      - gvm_internal

  notus-data:
    image: registry.community.greenbone.net/community/notus-data
    environment:
      KEEP_ALIVE: 1
    volumes:
      - notus_data_vol:/mnt
    networks:
      - gvm_internal

  scap-data:
    image: registry.community.greenbone.net/community/scap-data
    environment:
      KEEP_ALIVE: 1
    volumes:
      - scap_data_vol:/mnt
    networks:
      - gvm_internal

  cert-bund-data:
    image: registry.community.greenbone.net/community/cert-bund-data
    environment:
      KEEP_ALIVE: 1
    volumes:
      - cert_data_vol:/mnt
    networks:
      - gvm_internal

  dfn-cert-data:
    image: registry.community.greenbone.net/community/dfn-cert-data
    environment:
      KEEP_ALIVE: 1
    volumes:
      - cert_data_vol:/mnt
    depends_on:
      cert-bund-data:
        condition: service_healthy
    networks:
      - gvm_internal

  data-objects:
    image: registry.community.greenbone.net/community/data-objects
    environment:
      FEED_RELEASE: "24.10"
      KEEP_ALIVE: 1
    volumes:
      - data_objects_vol:/mnt
    networks:
      - gvm_internal

  report-formats:
    image: registry.community.greenbone.net/community/report-formats
    environment:
      FEED_RELEASE: "24.10"
      KEEP_ALIVE: 1
    volumes:
      - data_objects_vol:/mnt
    depends_on:
      data-objects:
        condition: service_healthy
    networks:
      - gvm_internal

  gpg-data:
    image: registry.community.greenbone.net/community/gpg-data
    volumes:
      - gpg_data_vol:/mnt
    networks:
      - gvm_internal

  gvm-redis:
    # Redis PROPIO de este bundle -- no comparte nada con el redis
    # principal de SentinelOps ni con el gvm-redis del stack principal
    # (volumenes y red completamente distintos, ningun puerto TCP
    # publicado en ninguno de los dos casos).
    image: registry.community.greenbone.net/community/redis-server
    restart: unless-stopped
    volumes:
      - gvm_redis_socket_vol:/run/redis/
    networks:
      - gvm_internal

  pg-gvm:
    image: registry.community.greenbone.net/community/pg-gvm:stable
    restart: unless-stopped
    volumes:
      - gvm_psql_data_vol:/var/lib/postgresql
      - gvm_psql_socket_vol:/var/run/postgresql
    depends_on:
      pg-gvm-migrator:
        condition: service_completed_successfully
    networks:
      - gvm_internal

  pg-gvm-migrator:
    image: registry.community.greenbone.net/community/pg-gvm-migrator:stable
    volumes:
      - gvm_psql_data_vol:/var/lib/postgresql
      - gvm_psql_socket_vol:/var/run/postgresql
    networks:
      - gvm_internal

  gvmd:
    image: registry.community.greenbone.net/community/gvmd:stable
    restart: unless-stopped
    volumes:
      - gvmd_data_vol:/var/lib/gvm
      - scap_data_vol:/var/lib/gvm/scap-data/
      - cert_data_vol:/var/lib/gvm/cert-data
      - data_objects_vol:/var/lib/gvm/data-objects/gvmd
      - vt_data_vol:/var/lib/openvas/plugins
      - gvm_psql_data_vol:/var/lib/postgresql
      - gvmd_socket_vol:/run/gvmd
      - ospd_openvas_socket_vol:/run/ospd
      - gvm_psql_socket_vol:/var/run/postgresql
    depends_on:
      pg-gvm:
        condition: service_started
      scap-data:
        condition: service_healthy
      cert-bund-data:
        condition: service_healthy
      dfn-cert-data:
        condition: service_healthy
      data-objects:
        condition: service_healthy
      report-formats:
        condition: service_healthy
    networks:
      - gvm_internal

  configure-openvas:
    image: registry.community.greenbone.net/community/openvas-scanner:stable
    volumes:
      - openvas_data_vol:/mnt
      - openvas_log_data_vol:/var/log/openvas
    command:
      - /bin/sh
      - -c
      - |
        printf "table_driven_lsc = yes\nopenvasd_server = http://openvasd:80\n" > /mnt/openvas.conf
        sed "s/127/128/" /etc/openvas/openvas_log.conf | sed 's/gvm/openvas/' > /mnt/openvas_log.conf
        chmod 644 /mnt/openvas.conf
        chmod 644 /mnt/openvas_log.conf
        touch /var/log/openvas/openvas.log
        chmod 666 /var/log/openvas/openvas.log
    networks:
      - gvm_internal

  openvas:
    image: registry.community.greenbone.net/community/openvas-scanner:stable
    volumes:
      - openvas_data_vol:/etc/openvas
      - openvas_log_data_vol:/var/log/openvas
    command:
      - /bin/sh
      - -c
      - |
        cat /etc/openvas/openvas.conf
        tail -f /var/log/openvas/openvas.log
    depends_on:
      configure-openvas:
        condition: service_completed_successfully
    networks:
      - gvm_internal

  openvasd:
    image: registry.community.greenbone.net/community/openvas-scanner:stable
    restart: unless-stopped
    environment:
      OPENVASD_MODE: service_notus
      GNUPGHOME: /etc/openvas/gnupg
      LISTENING: 0.0.0.0:80
    volumes:
      - openvas_data_vol:/etc/openvas
      - openvas_log_data_vol:/var/log/openvas
      - gpg_data_vol:/etc/openvas/gnupg
      - notus_data_vol:/var/lib/notus
    depends_on:
      vulnerability-tests:
        condition: service_healthy
      notus-data:
        condition: service_healthy
      configure-openvas:
        condition: service_completed_successfully
      gpg-data:
        condition: service_completed_successfully
    networks:
      - gvm_internal

  ospd-openvas:
    # Ver el comentario equivalente en el docker-compose.yml PRINCIPAL del
    # repo: NET_ADMIN/NET_RAW + seccomp/apparmor sin confinar son
    # ineliminables (el propio compose oficial de Greenbone los exige).
    # gvm_internal aisla este contenedor del resto de contenedores de ESTE
    # bundle; gvm_scan_egress es la red CON salida real que le da
    # visibilidad genuina de LAN/internet -- sin ella, igual que el bug
    # encontrado y arreglado en el stack principal (ver docker-compose.yml
    # de la raiz, commit 7aa39db: "ospd-openvas... quedaba con CERO salida
    # de red"), este contenedor no podria completar NINGUN escaneo real.
    image: registry.community.greenbone.net/community/ospd-openvas:stable
    restart: unless-stopped
    hostname: ospd-openvas.local
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - no-new-privileges:true
    command:
      [
        "ospd-openvas",
        "-f",
        "--config",
        "/etc/gvm/ospd-openvas.conf",
        "--notus-feed-dir",
        "/var/lib/notus/advisories",
        "-m",
        "666",
      ]
    volumes:
      - gpg_data_vol:/etc/openvas/gnupg
      - vt_data_vol:/var/lib/openvas/plugins
      - notus_data_vol:/var/lib/notus
      - ospd_openvas_socket_vol:/run/ospd
      - gvm_redis_socket_vol:/run/redis/
      - openvas_data_vol:/etc/openvas/
      - openvas_log_data_vol:/var/log/openvas
    depends_on:
      gvm-redis:
        condition: service_started
      gpg-data:
        condition: service_completed_successfully
      configure-openvas:
        condition: service_completed_successfully
      vulnerability-tests:
        condition: service_healthy
      notus-data:
        condition: service_healthy
    networks:
      - gvm_internal
      - gvm_scan_egress

  # Agente de escaneo remoto propiamente dicho: reusa remote-agent/agent.py
  # TAL CUAL (el mismo archivo que usan el Agente LAN/Agente Docker del
  # stack principal, copiado aca en build-time -- ver Dockerfile), pero
  # conectado al gvmd/ospd-openvas DE ESTA MAQUINA via el socket unix
  # compartido (gvmd_socket_vol), no al del stack principal (que esta en
  # otra maquina). A proposito NO se setea AGENT_BEHIND_DOCKER_NAT: a
  # diferencia del "Agente Docker" del stack principal, este contenedor SI
  # tiene (o deberia tener, ver README.md "Requisitos") visibilidad de red
  # real, asi que un target de LAN no se rechaza de entrada.
  openvas-agent:
    build:
      # Contexto en el padre (remote-agent/) para poder copiar
      # remote-agent/agent.py SIN duplicarlo -- ver Dockerfile.
      context: ..
      dockerfile: openvas-agent/Dockerfile
    restart: unless-stopped
    environment:
      SCAN_SERVICE_URL: ${SCAN_SERVICE_URL}
      AGENT_API_KEY: ${AGENT_API_KEY}
      POLL_INTERVAL_SECONDS: "10"
      GVM_SOCKET_PATH: /run/gvmd/gvmd.sock
      GVM_USER: ${GVM_USER}
      GVM_PASSWORD: ${GVM_PASSWORD}
    volumes:
      - gvmd_socket_vol:/run/gvmd:ro
    depends_on:
      gvmd:
        condition: service_started
    networks:
      # Para llegar al scan-service del stack PRINCIPAL (SCAN_SERVICE_URL)
      # -- via LAN/VPN/internet segun donde este, ver README.md.
      - gvm_scan_egress

networks:
  # Red interna del bundle -- coordinacion entre gvmd/ospd-openvas/redis/
  # postgres propios de GVM. `internal: true` les saca cualquier salida de
  # red (ni siquiera a internet): los datos de feed ya vienen empaquetados
  # en las imagenes de los populadores, no se descargan en runtime.
  gvm_internal:
    internal: true
  # Red CON salida real (sin `internal: true`), conectada solo a
  # ospd-openvas (para alcanzar los targets reales que escanea) y a
  # openvas-agent (para alcanzar el scan-service del stack principal).
  gvm_scan_egress: {}

volumes:
  gpg_data_vol:
  scap_data_vol:
  cert_data_vol:
  data_objects_vol:
  gvmd_data_vol:
  gvm_psql_data_vol:
  vt_data_vol:
  notus_data_vol:
  gvm_psql_socket_vol:
  gvmd_socket_vol:
  ospd_openvas_socket_vol:
  gvm_redis_socket_vol:
  openvas_data_vol:
  openvas_log_data_vol:
