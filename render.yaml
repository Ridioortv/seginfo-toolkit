# Blueprint de Render para licensing-server -- el UNICO servicio de este
# repo pensado para la nube (ver licensing-server/README.md y STATUS.md):
# el resto de TERO Security (scan-service, frontend, etc.) se
# distribuye como RAR para que cada cliente lo corra en su propia
# infraestructura on-prem, no tiene sentido ni sirve desplegarlo aca.
#
# Por que licensing-server anda igual en Render que en una PC local: ya
# esta escrito para los dos caminos desde el principio (ver app/db.py y
# el Dockerfile) -- sin DATABASE_URL usa SQLite en un volumen local (VPS
# propio), con DATABASE_URL usa Postgres (este camino: Render + Neon,
# donde el disco del plan free es descartable). El Dockerfile ya lee
# $PORT en vez de un puerto fijo (lo que exige Render) y expone
# GET /health, que se reusa aca como healthCheckPath. No hay
# threads/websockets/cron corriendo en proceso -- solo requests HTTP
# sync en el threadpool de FastAPI -- asi que el plan "free" (que duerme
# sin trafico) no rompe nada, solo agrega latencia de arranque en el
# primer request despues de dormir.
#
# Uso: Dashboard de Render -> New -> Blueprint -> conectar este repo.
# Render lee este archivo solo y crea el servicio. Las variables con
# "sync: false" las pide el dashboard en el momento de crear el servicio
# (nunca quedan en este archivo ni en el repo); "generateValue: true"
# hace que Render genere el secreto solo, sin pedirlo.
services:
  - type: web
    name: sentinelops-licensing-server
    runtime: docker
    dockerfilePath: ./licensing-server/Dockerfile
    dockerContext: ./licensing-server
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # ADMIN_TOKEN protege /admin/* -- Render puede generarlo solo, no
      # hace falta pensarlo (ver licensing-server/.env.example).
      - key: ADMIN_TOKEN
        generateValue: true
      # Clave Ed25519 de firma -- esta SI hay que generarla a mano con
      # `python generate_keys.py` (no es un secreto random generico,
      # tiene que ser el par que coincide con LICENSE_SERVER_PUBLIC_KEY
      # que se distribuye a los clientes) y pegarla aca cuando Render la
      # pida.
      - key: LICENSE_SIGNING_PRIVATE_KEY
        sync: false
      # Connection string de Neon (o Supabase) -- con esto seteado,
      # db.py usa Postgres en vez de SQLite (ver el comentario de
      # arriba). Pegar tal cual la da Neon, ya incluye sslmode=require.
      # LICENSING_DB_PATH/LICENSE_SERVER_DOMAIN no se listan aca a
      # proposito: son del camino VPS+Caddy, Render no los necesita.
      - key: DATABASE_URL
        sync: false
      # PayPal (cobro en USD, USD 250 cada 30 dias) -- las que se dejen
      # vacias hacen que los endpoints de PayPal devuelvan 503, sin
      # romper el resto del servicio (ver app/main.py).
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_PLAN_ID
        sync: false
      # PAYPAL_ENV / *_URL con sync:false A PROPOSITO: con "value:" Render los
      # vuelve a pisar en cada sincronizacion del blueprint (cada push que toca
      # este archivo), y un PAYPAL_ENV=live puesto a mano volvia a "sandbox" --
      # credenciales live contra el entorno sandbox = HTTP 401 de PayPal.
      # Setealos en el dashboard de Render (PAYPAL_ENV: sandbox o live).
      - key: PAYPAL_ENV
        sync: false
      - key: PAYPAL_RETURN_URL
        sync: false
      - key: PAYPAL_CANCEL_URL
        sync: false
      # Mercado Pago (segunda pasarela, cobro en pesos: USD 250 al cambio del
      # dia). Si MP_ACCESS_TOKEN queda vacio, los endpoints de Mercado Pago
      # devuelven 503 y PayPal sigue andando igual.
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: MP_NOTIFICATION_URL
        sync: false
      - key: MP_FALLBACK_RATE
        sync: false
      - key: MP_PRICE_USD
        value: "250"
      - key: MP_FX_URL
        value: https://dolarapi.com/v1/dolares/oficial
      - key: MP_FX_FIELD
        value: venta
      - key: MP_BACK_URL
        value: https://www.google.com/?sentinelops_subscribed=1
