server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # --- Cabeceras de seguridad (heredadas por todas las locations) ---------
    # CSP: sin scripts inline ni de terceros salvo el login de Google.
    # connect-src: las APIs del stack local (localhost/127.0.0.1). Si publicas
    # las APIs bajo otro dominio, agregalo aca y reconstrui el frontend.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http://localhost:* http://127.0.0.1:* https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # Solo lectura: nada de POST/PUT/DELETE contra el servidor estatico.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Nunca servir archivos ocultos ni mapas de fuentes.
    location ~ /\.(?!well-known) { return 404; }
    location ~ \.map$ { return 404; }

    # Assets con hash en el nombre: cache largo (expires no pisa los add_header).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # SPA: cualquier ruta del router cae en index.html (sin cache).
    location / {
        try_files $uri /index.html;
        expires -1;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
